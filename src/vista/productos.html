<!DOCTYPE html>
<html>
<body>
  <h1>Productos</h1>
  <ul id="lista"></ul>

  <script>
    fetch('/api/products')
      .then(res => res.json())
      .then(data => {
        const lista = document.getElementById('lista');

        data.payload.forEach(p => {
          const li = document.createElement('li');
          li.innerHTML = `
            ${p.titulo} - $${p.precio}
            <a href="/products/${p._id}">Ver</a>
          `;
          lista.appendChild(li);
        });
      });
  </script>
</body>
</html>
